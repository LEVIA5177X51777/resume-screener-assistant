<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Resume Screener Assistant{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Resume Screener <span>Assistant</span></a>
    <nav>
      <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">New analysis</a>
      <a href="/history" class="{% if request.url.path.startswith('/history') %}active{% endif %}">History</a>
      <a href="/docs" target="_blank" rel="noopener">API</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">Internal tool · AI output is advisory; final hiring decisions are made by people.</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
